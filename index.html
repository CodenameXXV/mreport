<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Topics & Report Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Шрифти */
        @font-face {
            font-family: 'Cochineal';
            src: url('https://github.com/CodenameXXV/report/raw/refs/heads/main/Cochineal.otf') format('opentype');
        }
        @font-face {
            font-family: 'Involve';
            src: url('https://github.com/CodenameXXV/report/raw/refs/heads/main/Involve.ttf') format('truetype');
        }

        :root {
            --heading-font: 'Cochineal', serif;
            --body-font: 'Involve', sans-serif;
            --grammar-color: #5c181f; 
            --vocab-color: #e0949d;   
            --bg-gradient-start: #fff4f4;
            --bg-gradient-end: #fce8e8;
            --surface-color: #ffffff;
            --border-color: #f0d5d8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh; padding: 20px; line-height: 1.6; color: #333;
        }
        
        .container {
            max-width: 1200px; margin: 0 auto; background: var(--surface-color);
            border-radius: 20px; box-shadow: 0 20px 60px rgba(92, 24, 31, 0.08);
            overflow: hidden; animation: fadeIn 0.8s ease-out;
            border: 1px solid var(--border-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, var(--grammar-color) 0%, #8a3c42 100%);
            color: white; padding: 15px 10px; text-align: center; position: relative;
        }
        
        .data-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .data-controls button {
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; font-size: 20px; cursor: pointer; border-radius: 8px; 
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .data-controls button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

        .header h1 { 
            font-size: 2.0em; margin-bottom: 5px; font-weight: 400; 
            font-family: var(--heading-font); display: flex; 
            align-items: center; justify-content: center; gap: 15px;
        }
        .app-logo { height: 45px; width: auto; object-fit: contain; }
        
        .main-content { padding: 30px; }

        .top-controls { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .control-section {
            background: linear-gradient(135deg, #ffffff 0%, #fffafb 100%);
            border-radius: 15px; padding: 15px; text-align: center; border: 1px solid var(--border-color);
            flex: 1; min-width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .date-selectors { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .control-section select {
            padding: 12px 20px; font-size: 14px; border: 2px solid var(--border-color);
            border-radius: 10px; background: white; cursor: pointer;
            width: 100%; max-width: 250px; outline: none; transition: border-color 0.2s;
            color: #4a4a4a; margin-top: 10px;
        }
        
        .student-controls-wrapper { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 10px; }
        .student-controls-wrapper select { margin-top: 0; max-width: 200px; flex: 1; }
        .btn-small {
            border: none; border-radius: 8px; width: 44px; height: 44px;
            cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .btn-add { background: var(--vocab-color); color: white; }
        .btn-del { background: #fdf2f3; border: 1px solid #f2dadd; color: #333; }

        .level-selection-section h3 { color: var(--grammar-color); font-size: 18px; margin-bottom: 10px; }
        .level-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .level-btn {
            background: var(--vocab-color); color: white;
            border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer;
            font-size: 14px; font-weight: 600; transition: all 0.2s ease;
        }
        .level-btn.active { background: var(--grammar-color); }

        .tag-search-wrapper { position: relative; width: 100%; max-width: 600px; margin: 0 auto 20px auto; }
        .tag-search-input {
            width: 100%; padding: 12px 20px 12px 50px; font-size: 14px;
            border: 2px solid var(--vocab-color); border-radius: 25px; outline: none;
        }

        .templates-section {
            background: #fffafb; border-radius: 15px; padding: 20px;
            margin-bottom: 25px; border: 1px solid var(--border-color); display: none;
        }
        .templates-section.show { display: block; }
        .template-category { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .template-btn {
            background: #fdf2f3; color: #4a4a4a; border: 1px solid #f2dadd; padding: 6px 12px;
            border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s;
        }
        .template-btn.used { background: var(--grammar-color) !important; color: white !important; }
        .template-btn.learned { background: #81575b !important; color: white !important; opacity: 0.7; }
        .level-header {
            background: var(--grammar-color); color: white; padding: 12px;
            border-radius: 8px; margin-bottom: 15px; font-weight: 600; text-align: center;
        }

        .preview-section {
            background: #fdfafb; border-radius: 15px; padding: 20px; text-align: center;
            border: 2px dashed #e4c7cb; margin-bottom: 30px;
        }

        #scaler-wrapper {
            width: 100%; display: flex; justify-content: center;
            background: #2d2627; border-radius: 15px; padding: 20px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            min-height: 600px; overflow: hidden;
        }

        #report-wrapper {
            display: flex; flex-direction: row; gap: 20px;
            transform-origin: top center; transition: transform 0.1s ease-out;
        }

        .page {
            width: 1000px; height: 1776px;
            background-image: url('https://raw.githubusercontent.com/CodenameXXV/report/refs/heads/main/GT.png');
            background-size: 100% 100%; position: relative;
            background-color: #fff4f4; box-shadow: 0 0 30px rgba(0,0,0,0.8);
            flex-shrink: 0; text-align: left;
        }

        .student-name-box {
            position: absolute; top: 13%; left: 8.5%;
            font-family: var(--heading-font); font-size: 48px; 
            color: var(--grammar-color); text-transform: uppercase;
            display: inline-block; min-width: 100px; outline: none;
            border-bottom: 3px solid var(--grammar-color); /* Виправлено для PNG */
            line-height: 0.95;
            padding-bottom: 5px;
        }

        .content-area {
            position: absolute; top: 330px; left: 85px; /* Блок піднято */
            width: 830px; height: 1210px; pointer-events: auto;
        }

        .month-box {
            position: absolute; bottom: 3.5%; right: 8.5%;
            display: flex; flex-direction: column; align-items: flex-end;
            color: var(--grammar-color); text-align: right;
        }
        .month-label { font-family: var(--body-font); font-size: 24px; margin-bottom: 2px; }
        .month-value { font-family: var(--body-font); font-size: 40px; font-weight: bold; text-transform: uppercase; outline: none; }

        .topic-header {
            position: relative; display: inline-block; margin-bottom: 15px;
            padding: 8px 24px; font-family: var(--heading-font); font-size: 42px;
        }
        .topic-header.grammar { color: var(--grammar-color); border: 2px dashed var(--grammar-color); }
        .topic-header.vocab { color: var(--vocab-color); border: 2px dashed var(--vocab-color); margin-top: 30px; }

        ol { font-family: var(--body-font); font-size: 30px; line-height: 1.3; padding-left: 45px; margin: 0; outline: none; color: #1a1a1a; }
        li { margin-bottom: 8px; min-height: 1.3em; padding-left: 10px; }

        .corner { position: absolute; width: 10px; height: 10px; }
        .grammar .corner { background-color: var(--grammar-color); }
        .vocab .corner { background-color: var(--vocab-color); }
        .top-left { top: -5px; left: -5px; } .top-right { top: -5px; right: -5px; }
        .bottom-left { bottom: -5px; left: -5px; } .bottom-right { bottom: -5px; right: -5px; }

        .action-buttons { margin-top: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn {
            color: white; border: none; padding: 12px 25px; border-radius: 10px;
            cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.3s ease;
        }
        .btn-png { background: linear-gradient(135deg, var(--grammar-color), #8a3c42); }
        .btn-pdf { background: linear-gradient(135deg, #d37680, var(--vocab-color)); }
        .btn-clear { background: linear-gradient(135deg, #8b797b, #6b5c5e); }

        .progress-section {
            background: #ffffff; border-radius: 15px; padding: 25px; margin-top: 10px;
            border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(92, 24, 31, 0.05); text-align: center;
        }
        .progress-bar-container { width: 100%; max-width: 800px; margin: 0 auto; background: var(--bg-gradient-end); border-radius: 20px; height: 28px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--vocab-color), var(--grammar-color)); width: 0%; transition: width 0.6s ease; display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: bold; }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="data-controls">
                <button onclick="importData()" title="Імпорт">📥</button>
                <button onclick="exportData()" title="Експорт">💾</button>
            </div>
            <h1>
                <img src="https://raw.githubusercontent.com/CodenameXXV/report/refs/heads/main/LOGO.png" alt="Logo" class="app-logo">
                English Topics & Report Generator
            </h1>
        </div>
        <div class="main-content">
            
            <div class="top-controls">
                <div class="control-section">
                    <label><strong>🗓️ Період:</strong></label><br>
                    <div class="date-selectors">
                        <select id="month" onchange="syncDateFromSelects()">
                            <option value="January">January</option><option value="February">February</option>
                            <option value="March">March</option><option value="April">April</option>
                            <option value="May">May</option><option value="June">June</option>
                            <option value="July">July</option><option value="August">August</option>
                            <option value="September">September</option><option value="October">October</option>
                            <option value="November">November</option><option value="December">December</option>
                        </select>
                        <select id="year" onchange="syncDateFromSelects()">
                            <option value="2024">2024</option><option value="2025">2025</option>
                            <option value="2026">2026</option><option value="2027">2027</option>
                        </select>
                    </div>
                </div>

                <div class="control-section">
                    <label><strong>🎓 Учень:</strong></label><br>
                    <div class="student-controls-wrapper">
                        <select id="student-select" onchange="changeStudent()"></select>
                        <button class="btn-small btn-add" onclick="addStudent()">➕</button>
                        <button class="btn-small btn-del" onclick="deleteStudent()">🗑️</button>
                    </div>
                </div>

                <div class="control-section level-selection-section">
                    <h3>🎯 Рівень</h3>
                    <div class="level-buttons">
                        <button class="level-btn" onclick="selectLevel('A1')">A1</button>
                        <button class="level-btn" onclick="selectLevel('A2')">A2</button>
                        <button class="level-btn" onclick="selectLevel('B1')">B1</button>
                        <button class="level-btn" onclick="selectLevel('B2')">B2</button>
                        <button class="level-btn" onclick="selectLevel('C1')">C1</button>
                    </div>
                </div>
            </div>

            <div class="tag-search-wrapper">
                <input type="text" class="tag-search-input" id="tag-search-input" placeholder="Шукати теми..." oninput="filterTopics(this.value)">
            </div>

            <div id="templates-section" class="templates-section show">
                <div id="templates-content"></div>
            </div>

            <div class="preview-section">
                <div id="scaler-wrapper">
                    <div id="report-wrapper">
                        <div class="page" id="page1">
                            <div class="student-name-box" contenteditable="true" id="name1">STUDENT NAME</div>
                            <div class="content-area" id="area1">
                                <div id="grammar-block">
                                    <div class="topic-header grammar">GRAMMAR TOPICS
                                        <div class="corner top-left"></div><div class="corner top-right"></div>
                                        <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
                                    </div>
                                    <ol id="grammar-list" contenteditable="true"><li></li></ol>
                                </div>
                                <div id="vocab-block">
                                    <div class="topic-header vocab">VOCABULARY TOPICS
                                        <div class="corner top-left"></div><div class="corner top-right"></div>
                                        <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
                                    </div>
                                    <ol id="vocab-list" contenteditable="true"><li></li></ol>
                                </div>
                            </div>
                            <div class="month-box">
                                <div class="month-label">Month:</div>
                                <div class="month-value" contenteditable="true" id="month1">JANUARY</div>
                            </div>
                        </div>
                        <div class="page" id="page2" style="display: none;">
                            <div class="student-name-box" id="name2">STUDENT NAME</div>
                            <div class="content-area" id="area2"></div>
                            <div class="month-box">
                                <div class="month-label">Month:</div>
                                <div class="month-value" id="month2">JANUARY</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-clear" onclick="clearTemplate()">🗑️ Очистити</button>
                    <button class="btn btn-png" onclick="downloadPNG()">🖼️ Зберегти PNG</button>
                    <button class="btn btn-pdf" onclick="downloadPDF()">📑 Зберегти PDF</button>
                </div>
            </div>

            <div class="progress-section">
                <h3>📊 Прогрес <span id="progress-level-label">A1</span> (<span id="progress-student-label"></span>)</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-bar-fill">0%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let templatesData = {};
        let appData = JSON.parse(localStorage.getItem('englishReportData_v2')) || {
            students: ["Student Name"], currentStudent: "Student Name", records: {}, studentLevels: { "Student Name": "A1" }
        };
        let currentLevel = appData.studentLevels[appData.currentStudent] || 'A1';

        const area1 = document.getElementById('area1');
        const area2 = document.getElementById('area2');
        const vocabBlock = document.getElementById('vocab-block');
        const grammarBlock = document.getElementById('grammar-block');
        const page2 = document.getElementById('page2');
        const wrapper = document.getElementById('report-wrapper');
        const scalerWrapper = document.getElementById('scaler-wrapper');
        const n1 = document.getElementById('name1');
        const n2 = document.getElementById('name2');
        const m1 = document.getElementById('month1');
        const m2 = document.getElementById('month2');

        window.onload = async function() {
            await loadExternalData();
            const now = new Date();
            document.getElementById('month').value = now.toLocaleString('en-US', { month: 'long' });
            document.getElementById('year').value = now.getFullYear().toString();
            renderStudentSelect();
            selectLevel(appData.studentLevels[appData.currentStudent] || 'A1', true);
            syncDateFromSelects(); 
            adjustScale();
            window.addEventListener('resize', adjustScale);
            setupCanvasListeners();
        };

        async function loadExternalData() {
            try {
                const [gRes, vRes] = await Promise.all([
                    fetch('https://raw.githubusercontent.com/CodenameXXV/report/main/grammar.json'),
                    fetch('https://raw.githubusercontent.com/CodenameXXV/report/main/vocabulary.json')
                ]);
                const gData = await gRes.json();
                const vData = await vRes.json();
                ['A1', 'A2', 'B1', 'B2', 'C1'].forEach(lvl => {
                    templatesData[lvl] = { grammar: gData[lvl] || [], vocabulary: vData[lvl] || [] };
                });
            } catch (e) { console.error(e); }
        }

        function saveDB() { localStorage.setItem('englishReportData_v2', JSON.stringify(appData)); }

        function renderStudentSelect() {
            const s = document.getElementById('student-select');
            s.innerHTML = '';
            appData.students.forEach(n => {
                const o = document.createElement('option'); o.value = n; o.textContent = n;
                s.appendChild(o);
            });
            s.value = appData.currentStudent;
            n1.textContent = appData.currentStudent;
            document.getElementById('progress-student-label').textContent = appData.currentStudent;
            syncNamesAndAdjustSize();
        }

        function changeStudent() {
            appData.currentStudent = document.getElementById('student-select').value;
            renderStudentSelect(); 
            selectLevel(appData.studentLevels[appData.currentStudent] || 'A1', true);
            syncDateFromSelects(); saveDB();
        }

        function addStudent() {
            const n = prompt("Ім'я учня:");
            if (n && n.trim()) {
                const t = n.trim();
                if (!appData.students.includes(t)) {
                    appData.students.push(t); appData.records[t] = {}; appData.studentLevels[t] = 'A1';
                }
                appData.currentStudent = t;
                renderStudentSelect(); selectLevel('A1'); syncDateFromSelects(); saveDB();
            }
        }

        function deleteStudent() {
            if (appData.students.length <= 1) return;
            if (confirm(`Видалити "${appData.currentStudent}"?`)) {
                appData.students = appData.students.filter(s => s !== appData.currentStudent);
                delete appData.records[appData.currentStudent]; delete appData.studentLevels[appData.currentStudent];
                appData.currentStudent = appData.students[0];
                renderStudentSelect(); selectLevel(appData.studentLevels[appData.currentStudent] || 'A1', true);
                syncDateFromSelects(); saveDB();
            }
        }

        function getPeriodKey() { return `${document.getElementById('month').value}-${document.getElementById('year').value}`; }

        function selectLevel(lvl, preventSave = false) {
            currentLevel = lvl;
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            const active = Array.from(document.querySelectorAll('.level-btn')).find(b => b.textContent === lvl);
            if(active) active.classList.add('active');
            if (!preventSave) { appData.studentLevels[appData.currentStudent] = lvl; saveDB(); }
            loadTemplatesForLevel(lvl); syncTemplateButtonStates(); updateProgressBar();
        }

        /* ПОВЕРНУТО ВІДОБРАЖЕННЯ КАТЕГОРІЙ */
        function loadTemplatesForLevel(lvl) {
            const tc = document.getElementById('templates-content');
            const data = templatesData[lvl];
            if (!data) return;
            let h = `<div class="level-header">📚 ${lvl} LEVEL TEMPLATES</div>`;
            const rSec = (title, sData, type, css) => {
                let sH = `<h4 style="color: var(--${type}-color); margin: 15px 0 10px; font-family: var(--heading-font);">${title}</h4>`;
                
                if (Array.isArray(sData)) {
                    sH += `<div class="template-category">`;
                    sData.forEach(t => sH += `<button class="template-btn ${css}" data-type="${type}" data-template="${t.replace(/"/g, '&quot;')}">${t.split(' — ')[0]}</button>`);
                    sH += `</div>`;
                } else if (typeof sData === 'object' && sData !== null) {
                    for (const [cat, items] of Object.entries(sData)) {
                        sH += `<div style="font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #555; text-align: left; padding-left: 10px;">${cat}</div><div class="template-category">`;
                        items.forEach(t => sH += `<button class="template-btn ${css}" data-type="${type}" data-template="${t.replace(/"/g, '&quot;')}">${t.split(' — ')[0]}</button>`);
                        sH += `</div>`;
                    }
                }
                return sH;
            };
            h += rSec('Grammar', data.grammar, 'grammar', 'grammar') + rSec('Vocabulary', data.vocabulary, 'vocab', 'vocabulary');
            tc.innerHTML = h;
            document.querySelectorAll('.template-btn').forEach(b => {
                b.addEventListener('click', function() { toggleTemplateOnCanvas(this.dataset.type, this.dataset.template); });
            });
        }

        function filterTopics(q) {
            const query = q.toLowerCase().trim();
            document.querySelectorAll('.template-btn').forEach(b => {
                b.style.display = (query === '' || b.dataset.template.toLowerCase().includes(query)) ? '' : 'none';
            });
        }

        function toggleTemplateOnCanvas(type, text) {
            const list = document.getElementById(type === 'grammar' ? 'grammar-list' : 'vocab-list');
            let items = Array.from(list.querySelectorAll('li'));
            let existing = items.find(li => li.textContent.trim() === text);
            if (existing) {
                existing.remove();
                if (list.children.length === 0) list.innerHTML = '<li></li>';
            } else {
                if (list.children.length === 1 && list.children[0].textContent.trim() === '') list.innerHTML = '';
                const li = document.createElement('li'); li.textContent = text;
                list.appendChild(li);
            }
            onCanvasContentChanged();
        }

        function clearTemplate() {
            document.getElementById('grammar-list').innerHTML = '<li></li>';
            document.getElementById('vocab-list').innerHTML = '<li></li>';
            onCanvasContentChanged();
        }

        function setupCanvasListeners() {
            document.getElementById('grammar-list').addEventListener('input', onCanvasContentChanged);
            document.getElementById('vocab-list').addEventListener('input', onCanvasContentChanged);
            n1.addEventListener('input', () => { syncNamesAndAdjustSize(); handleNameChangeInDB(); });
            m1.addEventListener('input', () => { m2.innerText = m1.innerText; });
        }

        function syncNamesAndAdjustSize() {
            n2.innerText = n1.innerText;
            const len = n1.innerText.length;
            let size = 48;
            if (len > 17) size = Math.max(24, Math.floor(48 * (17 / len)));
            n1.style.fontSize = `${size}px`; n2.style.fontSize = `${size}px`;
        }

        function syncDateFromSelects() {
            const m = document.getElementById('month').value;
            loadPeriodState(getPeriodKey());
            m1.textContent = m; m2.textContent = m;
        }

        function handleNameChangeInDB() {
            const n = n1.textContent.trim() || "Student Name";
            if (n !== appData.currentStudent && appData.students.includes(appData.currentStudent)) {
                const idx = appData.students.indexOf(appData.currentStudent);
                appData.students[idx] = n;
                appData.records[n] = appData.records[appData.currentStudent]; delete appData.records[appData.currentStudent];
                appData.studentLevels[n] = appData.studentLevels[appData.currentStudent]; delete appData.studentLevels[appData.currentStudent];
                appData.currentStudent = n; renderStudentSelect(); saveDB();
            }
        }

        function handleOverflow() {
            const maxH = 1210; 
            const curH = grammarBlock.offsetHeight + vocabBlock.offsetHeight + 40;
            if (curH > maxH) {
                if (vocabBlock.parentElement !== area2) { page2.style.display = 'block'; area2.appendChild(vocabBlock); }
            } else {
                if (vocabBlock.parentElement !== area1) { area1.appendChild(vocabBlock); page2.style.display = 'none'; }
            }
            adjustScale();
        }

        function adjustScale() {
            const pages = page2.style.display === 'none' ? 1 : 2;
            const bW = (pages * 1000) + ((pages - 1) * 20);
            const bH = 1776;
            const sX = scalerWrapper.clientWidth / bW;
            const sY = (window.innerHeight - 150) / bH;
            const scale = Math.min(sX, sY, 0.8);
            wrapper.style.transform = `scale(${scale})`;
            scalerWrapper.style.height = `${bH * scale + 40}px`;
        }

        function onCanvasContentChanged() {
            handleOverflow(); syncTemplateButtonStates(); saveCurrentPeriodState(); updateProgressBar();
        }

        function saveCurrentPeriodState() {
            const k = getPeriodKey();
            const g = Array.from(document.querySelectorAll('#grammar-list li')).map(li => li.textContent.trim()).filter(x => x);
            const v = Array.from(document.querySelectorAll('#vocab-list li')).map(li => li.textContent.trim()).filter(x => x);
            if (!appData.records[appData.currentStudent]) appData.records[appData.currentStudent] = {};
            appData.records[appData.currentStudent][k] = { grammar: g, vocabulary: v }; saveDB();
        }

        function loadPeriodState(k) {
            const d = (appData.records[appData.currentStudent] || {})[k] || { grammar: [], vocabulary: [] };
            const pop = (id, items) => {
                const l = document.getElementById(id); l.innerHTML = items.length ? '' : '<li></li>';
                items.forEach(t => { const li = document.createElement('li'); li.textContent = t; l.appendChild(li); });
            };
            pop('grammar-list', d.grammar); pop('vocab-list', d.vocabulary);
            onCanvasContentChanged();
        }

        function syncTemplateButtonStates() {
            const all = Array.from(document.querySelectorAll('ol li')).map(li => li.textContent.trim());
            const curK = getPeriodKey();
            let past = new Set();
            for (const [pk, rec] of Object.entries(appData.records[appData.currentStudent] || {})) {
                if (pk !== curK) { (rec.grammar || []).forEach(t => past.add(t)); (rec.vocabulary || []).forEach(t => past.add(t)); }
            }
            document.querySelectorAll('.template-btn').forEach(b => {
                const isCur = all.includes(b.dataset.template);
                b.classList.toggle('used', isCur);
                b.classList.toggle('learned', !isCur && past.has(b.dataset.template));
            });
        }

        function updateProgressBar() {
            const flatG = Array.isArray(templatesData[currentLevel]?.grammar) ? templatesData[currentLevel].grammar : Object.values(templatesData[currentLevel]?.grammar || {}).flat();
            let learned = new Set();
            Object.values(appData.records[appData.currentStudent] || {}).forEach(r => {
                (r.grammar || []).forEach(t => { if (flatG.includes(t)) learned.add(t); });
            });
            const p = flatG.length > 0 ? Math.round((learned.size / flatG.length) * 100) : 0;
            const fill = document.getElementById('progress-bar-fill');
            fill.style.width = p + '%'; fill.textContent = p > 5 ? `${p}% (${learned.size}/${flatG.length})` : '';
            document.getElementById('progress-level-label').textContent = currentLevel;
        }

        function exportData() {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" }));
            a.download = 'EnglishReport_Backup.json'; a.click();
        }

        function importData() {
            const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json';
            i.onchange = (e) => {
                const r = new FileReader();
                r.onload = (ev) => { try { appData = JSON.parse(ev.target.result); saveDB(); location.reload(); } catch(e) { alert("Error"); } };
                r.readAsText(e.target.files[0]);
            }; i.click();
        }

        async function downloadPNG() {
            const trans = wrapper.style.transform;
            wrapper.style.transform = 'scale(1)';
            await new Promise(r => setTimeout(r, 200));
            const name = n1.innerText.trim() || 'Student';
            const c1 = await html2canvas(document.getElementById('page1'), { scale: 2, useCORS: true });
            const l1 = document.createElement('a'); l1.download = `Report_${name}_P1.png`;
            l1.href = c1.toDataURL("image/png"); l1.click();
            if (page2.style.display !== 'none') {
                const c2 = await html2canvas(document.getElementById('page2'), { scale: 2, useCORS: true });
                const l2 = document.createElement('a'); l2.download = `Report_${name}_P2.png`;
                l2.href = c2.toDataURL("image/png"); l2.click();
            }
            wrapper.style.transform = trans;
        }

        async function downloadPDF() {
            const trans = wrapper.style.transform;
            wrapper.style.transform = 'scale(1)';
            await new Promise(r => setTimeout(r, 200));
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'px', format: [1000, 1776] });
            const c1 = await html2canvas(document.getElementById('page1'), { scale: 2, useCORS: true });
            pdf.addImage(c1.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 1000, 1776);
            if (page2.style.display !== 'none') {
                pdf.addPage();
                const c2 = await html2canvas(document.getElementById('page2'), { scale: 2, useCORS: true });
                pdf.addImage(c2.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 1000, 1776);
            }
            pdf.save(`Report_${n1.innerText.trim()}.pdf`);
            wrapper.style.transform = trans;
        }
    </script>
</body>
</html>
